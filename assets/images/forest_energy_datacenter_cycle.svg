<svg width="100%" viewBox="0 0 690 690" role="img" xmlns="http://www.w3.org/2000/svg"
     font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Forest · Energy · Data — a self-reinforcing 25-year cycle</title>
  <desc>Three nodes — native forest restoration, locally generated renewable energy, and community-owned data center — each feeding the others, bound together by a shared 25-year ledger of methods, data, and outcomes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="context-stroke"/>
    </marker>
    <symbol id="tree" viewBox="0 0 24 32">
      <polygon points="12,2 22,18 2,18" fill="#639922"/>
      <polygon points="12,7 20,21 4,21" fill="#3B6D11"/>
      <rect x="10" y="21" width="4" height="8" rx="1" fill="#633806"/>
    </symbol>
    <symbol id="bolt" viewBox="0 0 24 32">
      <polygon points="14,2 5,17 12,17 10,30 19,13 13,13" fill="#FFCF6A"/>
    </symbol>
    <symbol id="server" viewBox="0 0 28 32">
      <rect x="2" y="2"  width="24" height="7" rx="2" fill="#5FA0E6"/>
      <rect x="2" y="12" width="24" height="7" rx="2" fill="#2E7BC9"/>
      <rect x="2" y="22" width="24" height="7" rx="2" fill="#0C447C"/>
      <circle cx="23" cy="5.5"  r="1.6" fill="#E6F1FB"/>
      <circle cx="23" cy="15.5" r="1.6" fill="#B5D4F4"/>
      <circle cx="23" cy="25.5" r="1.6" fill="#B5D4F4"/>
    </symbol>
    <!-- white halo behind text/labels so they stay readable over any line -->
    <style>
      .lbl   { paint-order:stroke; stroke:#ffffff; stroke-width:5px; stroke-linejoin:round; font-weight:600; }
      .node-title { font-size:23px; font-weight:700; paint-order:stroke; stroke-width:4px; stroke-linejoin:round; }
      .node-sub   { font-size:16px; font-weight:600; paint-order:stroke; stroke-width:3.5px; stroke-linejoin:round; }
      .edge  { font-size:15px; }
      .node  { cursor:pointer; }
      .node circle { transition:filter .15s ease; }
      .node:hover circle { filter:brightness(1.12); }
    </style>
  </defs>

  <!-- ── background wash ── -->
  <rect x="0" y="0"   width="690" height="400" fill="#EAF3DE" opacity="0.35"/>
  <rect x="0" y="380" width="690" height="310" fill="#EAF3DE" opacity="0.5"/>

  <!-- ── LEDGER RING (center) ── -->
  <circle cx="340" cy="340" r="120" fill="none" stroke="#B7B5AC" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="340" cy="340" r="90"  fill="#F1EFE8" stroke="#B7B5AC" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" class="lbl" fill="#4A4945" font-size="17" font-weight="700">25-year ledger</text>
  <text x="340" y="348" text-anchor="middle" class="lbl" fill="#6B6A64" font-size="14">methods · data · outcomes</text>
  <text x="340" y="368" text-anchor="middle" class="lbl" fill="#6B6A64" font-size="14">community ownership</text>

  <!-- ══ ARROWS (drawn under nodes) ══ -->
  <g stroke-width="4.5" fill="none" stroke-linecap="round">
    <!-- Forest → Energy -->
    <path d="M280 176 Q188 300 184 448" stroke="#3B6D11" marker-end="url(#arrow)"/>
    <!-- Energy → Forest -->
    <path d="M176 448 Q158 296 296 178" stroke="#BA7517" marker-end="url(#arrow)"/>
    <!-- Energy → Data -->
    <path d="M236 524 L444 524" stroke="#EF9F27" marker-end="url(#arrow)"/>
    <!-- Data → Energy -->
    <path d="M444 512 L236 512" stroke="#185FA5" marker-end="url(#arrow)"/>
    <!-- Forest → Data -->
    <path d="M400 176 Q492 300 496 448" stroke="#3B6D11" marker-end="url(#arrow)"/>
    <!-- Data → Forest -->
    <path d="M504 448 Q522 296 384 178" stroke="#0C447C" marker-end="url(#arrow)"/>
  </g>

  <!-- ══ EDGE LABELS ══ -->
  <text x="196" y="292" text-anchor="middle" class="lbl edge" fill="#3B6D11">timber</text>
  <text x="150" y="330" text-anchor="middle" class="lbl edge" fill="#BA7517">funds restoration</text>
  <text x="340" y="507" text-anchor="middle" class="lbl edge" fill="#C77A0E">powers compute</text>
  <text x="340" y="548" text-anchor="middle" class="lbl edge" fill="#185FA5">grid optimisation</text>
  <text x="486" y="292" text-anchor="middle" class="lbl edge" fill="#3B6D11">monitoring data</text>
  <text x="534" y="330" text-anchor="middle" class="lbl edge" fill="#0C447C">AI models</text>

  <!-- ══ NODE 1 — NATIVE FOREST (top) ══ -->
  <g class="node" onclick="sendPrompt('Tell me more about native forest restoration in Mitsue village and how it connects to EV charging and community energy resilience')">
    <circle cx="340" cy="120" r="70" fill="#27500A" stroke="#97C459" stroke-width="3"/>
    <use href="#tree" x="308" y="78" width="20" height="28"/>
    <use href="#tree" x="327" y="72" width="26" height="34"/>
    <use href="#tree" x="352" y="78" width="20" height="28"/>
    <text x="340" y="138" text-anchor="middle" class="node-title" stroke="#183405" fill="#FFFFFF">Native forest</text>
    <text x="340" y="158" text-anchor="middle" class="node-sub"   stroke="#183405" fill="#DCEEBF">restoration</text>
  </g>

  <!-- ══ NODE 2 — RENEWABLE ENERGY (bottom-left) ══ -->
  <g class="node" onclick="sendPrompt('How does locally generated solar and battery energy connect forest restoration to the data center and EV charging in Mitsue?')">
    <circle cx="164" cy="520" r="70" fill="#7A4A08" stroke="#EF9F27" stroke-width="3"/>
    <use href="#bolt" x="146" y="484" width="34" height="40"/>
    <text x="164" y="540" text-anchor="middle" class="node-title" stroke="#3D2504" fill="#FFFFFF">Renewable</text>
    <text x="164" y="562" text-anchor="middle" class="node-sub"   stroke="#3D2504" fill="#FBE0B4">energy · local</text>
  </g>

  <!-- ══ NODE 3 — DATA CENTER (bottom-right) ══ -->
  <g class="node" onclick="sendPrompt('What is the community-owned micro data center concept for Mitsue elementary school?')">
    <circle cx="516" cy="520" r="70" fill="#0C447C" stroke="#85B7EB" stroke-width="3"/>
    <use href="#server" x="500" y="482" width="30" height="34"/>
    <text x="516" y="540" text-anchor="middle" class="node-title" stroke="#052240" fill="#FFFFFF">Data center</text>
    <text x="516" y="562" text-anchor="middle" class="node-sub"   stroke="#052240" fill="#CBE0F7">community-owned</text>
  </g>
</svg>
